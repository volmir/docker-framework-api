memory_limit=256M
date.timezone=${TZ:-UTC}
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
expose_php=Off

opcache.enable=1
opcache.validate_timestamps=0
opcache.max_accelerated_files=10000
opcache.memory_consumption=128
opcache.interned_strings_buffer=8

upload_max_filesize=1M
post_max_size=1M
